# Complemento (drop-in) do serviço "caddy" do pacote oficial, para o IndustrialSim Web (Etapa 9A).
# Instalado em /etc/systemd/system/caddy.service.d/industrialsim.conf pelo deploy/scripts/install.sh.

[Unit]
# Com Restart=always, nunca desistir depois de várias falhas seguidas.
StartLimitIntervalSec=0

[Service]
# Endereço do site (INDUSTRIALSIM_SITE), lido pelo Caddyfile como {$INDUSTRIALSIM_SITE}.
EnvironmentFile=/etc/industrialsim/caddy.env
Restart=always
RestartSec=2
