<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Planta · Cena 3D</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c8dfaff3c31198ac92f85c7937c771d0">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.scene{position:relative;height:796px;overflow:hidden;background:linear-gradient(180deg,var(--color-surface-sunken) 0%,var(--color-bg) 62%,var(--color-border) 62.2%,var(--color-bg) 100%)}
.hud{position:absolute;background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow-popover)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;margin-right:2px;border:1px solid var(--color-border-strong);border-bottom-width:2px;border-radius:4px;font-family:var(--font-family-mono);font-size:12px;background:var(--color-surface)}
</style>
</helmet>
<div class="app" style="min-height: 900px">
  <dc-import name="PlantBar" tab="process" hint-size="100%,104px"></dc-import>
  <div class="scene" role="img" aria-label="Cena 3D da caldeira em primeira pessoa, com o PT-101 apontado">
    <svg viewBox="0 0 1440 796" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0">
      <ellipse cx="720" cy="560" rx="420" ry="60" style="fill: var(--color-border)" opacity=".5"></ellipse>
      <rect x="520" y="300" width="400" height="190" rx="95" style="fill: var(--color-surface); stroke: var(--color-equipment)" stroke-width="5"></rect>
      <path d="M528 400 H912 V410 C912 455 875 482 830 482 H610 C565 482 528 455 528 410 Z" style="fill: var(--color-water)"></path>
      <rect x="600" y="490" width="16" height="70" style="fill: var(--color-equipment)"></rect>
      <rect x="824" y="490" width="16" height="70" style="fill: var(--color-equipment)"></rect>
      <path d="M720 300 V200 H1180" fill="none" style="stroke: var(--color-equipment)" stroke-width="14"></path>
      <path d="M240 520 H500 V430 H520" fill="none" style="stroke: var(--color-equipment)" stroke-width="14"></path>
      <circle cx="330" cy="520" r="44" style="fill: var(--color-equipment-on)"></circle>
      <rect x="560" y="580" width="320" height="90" rx="6" style="fill: var(--color-surface); stroke: var(--color-equipment)" stroke-width="5"></rect>
      <path d="M680 300 V260" style="stroke: var(--color-equipment)" stroke-width="6"></path>
      <circle cx="680" cy="246" r="18" style="fill: var(--color-surface); stroke: var(--color-accent)" stroke-width="4"></circle>
      <path d="M920 360 H970 V330" fill="none" style="stroke: var(--color-equipment)" stroke-width="6"></path>
      <rect x="954" y="300" width="32" height="32" rx="4" style="fill: var(--color-surface); stroke: var(--color-equipment)" stroke-width="4"></rect>
      <circle cx="680" cy="246" r="9" fill="none" style="stroke: var(--color-text)" stroke-width="2"></circle>
    </svg>

    <div class="hud row" style="left: 16px; top: 16px; gap: 8px">
      <span class="row" style="gap: 0; border: 1px solid var(--color-border-strong); border-radius: 6px; overflow: hidden"><a href="T06-IHM.dc.html" style="padding: 4px 12px; text-decoration: none">2D</a><span style="padding: 4px 12px; background: var(--color-accent); color: var(--color-on-accent); font-weight: 600">3D</span></span>
      <button type="button" class="{{ cutCls }}" aria-pressed="{{ cutOn }}" onClick="{{ toggleCut }}">Vista em corte</button>
      <a class="btn btn-sm" href="T21-VR.dc.html"><dc-import name="Icon" icon="cube" size="{{ s16 }}" hint-size="16px,16px"></dc-import>Entrar em VR</a>
    </div>

    <div class="hud col" style="right: 16px; top: 16px; width: 300px; gap: 4px">
      <strong>Alarmes</strong><span class="muted">Nenhum alarme ativo</span>
    </div>

    <div class="hud col" style="left: 50%; top: 120px; width: 270px; gap: 4px">
      <span class="lbl">Instrumento apontado</span>
      <strong class="mono">PT-101 · Pressão do vapor</strong>
      <span class="mono" style="font-size: 24px; font-weight: 600">{{ pt }}</span>
      <span class="muted small">{{ ma }} · faixa 0–16 bar</span>
      <a href="T07-Faceplate.dc.html" class="small">Abrir detalhe (E)</a>
    </div>

    <div class="hud row" style="left: 16px; bottom: 16px; gap: 16px">
      <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> andar</span>
      <span>mouse: olhar</span>
      <span><span class="key">E</span> detalhe</span>
      <span><span class="key">Esc</span> soltar o mouse</span>
      <span class="muted small">Também dá para navegar pelos botões ⟵ ⟶ e pela lista de instrumentos.</span>
    </div>

    <div class="hud col" style="right: 16px; bottom: 16px; width: 380px; gap: 6px">
      <div class="row"><strong>Tendências</strong><a class="push small" href="T25-Graficos.dc.html">Abrir na aba Gráficos</a></div>
      <svg viewBox="0 0 360 70" width="100%" height="70" aria-hidden="true" style="background: var(--color-surface-sunken); border-radius: 4px"><path d="{{ path }}" fill="none" style="stroke: var(--color-accent)" stroke-width="2"></path></svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0, cut: false };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ tick: this.state.tick + 1 }), 500);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const t = this.state.tick;
    const p = 10 + 0.04 * Math.sin(t * 0.3);
    let d = '';
    for (let i = 0; i <= 60; i++) d += (i ? ' L' : 'M') + (i * 6) + ' ' + (35 + 8 * Math.sin((i + t) * 0.25)).toFixed(1);
    const fmt = (v, n) => v.toFixed(n).replace('.', ',');
    return {
      s16: 16,
      pt: fmt(p, 2) + ' bar', ma: fmt(4 + p, 2) + ' mA', path: d,
      cutOn: this.state.cut ? 'true' : 'false',
      cutCls: this.state.cut ? 'btn btn-sm btn-primary' : 'btn btn-sm',
      toggleCut: () => this.setState({ cut: !this.state.cut })
    };
  }
}
</script>
</body>
</html>
