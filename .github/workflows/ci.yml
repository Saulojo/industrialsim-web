# CI: build e testes do .NET e do web a cada push e pull request; ponta a ponta com Playwright desde a Etapa 7.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    # Linux é o sistema do servidor (VM no PC do laboratório, D10); Windows continua para manter o código multiplataforma.
    name: .NET (build e testes, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Restore (versões travadas)
        run: dotnet restore server/IndustrialSim.sln --locked-mode

      - name: Build (avisos são erros)
        run: dotnet build server/IndustrialSim.sln --no-restore --configuration Release -warnaserror

      - name: Testes
        working-directory: server
        run: dotnet test --no-build --configuration Release

  # A proteção da main exige um check chamado ".NET (build e testes)". Este job resume a matriz acima e só
  # passa se o .NET passou no Windows e no Linux (com "always", uma falha na matriz vira falha aqui, e não
  # um job pulado, que contaria como aprovado).
  dotnet-summary:
    name: .NET (build e testes)
    runs-on: ubuntu-latest
    needs: [dotnet]
    if: always()
    steps:
      - name: Windows e Linux passaram
        run: test "${{ needs.dotnet.result }}" = "success"

  hart-poc:
    name: Prova HART da Etapa 2 (build e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: tools/hart-poc/**/packages.lock.json

      - name: Restore (versões travadas)
        run: dotnet restore tools/hart-poc/HartPoc.sln --locked-mode

      - name: Build (avisos são erros)
        run: dotnet build tools/hart-poc/HartPoc.sln --no-restore --configuration Release -warnaserror

      - name: Testes
        working-directory: tools/hart-poc
        run: dotnet test --no-build --configuration Release

  web:
    name: Web (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Etapa 7: a IHM no Chromium contra o servidor de verdade (laço, Modbus e WebSocket); um teste por
    # critério de validação da etapa.
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Build do web para o wwwroot do servidor
        run: npm run build
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run e2e

  integration:
    name: Integração (servidor servindo o web)
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build do web para o wwwroot do servidor
        working-directory: web
        run: npm ci && npm run build

      - name: Build do servidor
        run: dotnet build server/src/IndustrialSim.Server --configuration Release

      # Roda a DLL direto (e não por "dotnet run"), para o sinal chegar ao próprio servidor. O encerramento é
      # por SIGTERM, o sinal de um gerenciador de serviços: num bash não interativo, um processo iniciado com
      # "&" ignora o SIGINT (POSIX, sem controle de jobs). O Ctrl+C foi verificado no Windows (Etapa 5).
      - name: Sobe o servidor, confere a página e a API e encerra com plantas ativas (Etapa 5)
        working-directory: server/src/IndustrialSim.Server
        run: |
          dotnet bin/Release/net10.0/IndustrialSim.Server.dll --urls http://127.0.0.1:5080 > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5080/api/health > health.json && break
            sleep 1
          done
          cat health.json
          grep -q '"version":"0.1.0' health.json
          curl -sf http://127.0.0.1:5080/ | grep -q '<div id="root">'
          echo "Servidor respondeu /api/health e serviu a página."

          curl -sf http://127.0.0.1:5080/api/scenarios | grep -q '"id":"caldeira"'
          for i in $(seq 1 5); do
            curl -sf -X POST -H 'Content-Type: application/json' -d '{"scenarioId":"caldeira","record":true}' http://127.0.0.1:5080/api/plants > /dev/null
          done
          sleep 2
          curl -sf http://127.0.0.1:5080/api/simulation/metrics | tee metrics.json
          grep -q '"plantCount":5' metrics.json
          echo

          kill -TERM "$SERVER_PID"
          for i in $(seq 1 50); do
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "O servidor não terminou 5 s depois do SIGTERM."
            exit 1
          fi
          set +e
          wait "$SERVER_PID"
          EXIT_CODE=$?
          set -e
          echo "Código de saída do servidor: $EXIT_CODE"
          test "$EXIT_CODE" -eq 0
          grep -q 'Application is shutting down' "$GITHUB_WORKSPACE/server.log"
          grep -q 'encerrada (Shutdown)' "$GITHUB_WORKSPACE/server.log"
          grep -q 'threads ainda vivas: 0' "$GITHUB_WORKSPACE/server.log"
          echo "Servidor encerrado com 5 plantas ativas, sem threads do laço penduradas."

      - name: Log do servidor
        if: always()
        run: cat server.log || true

  deploy:
    # Etapa 9A: arquivos de implantação conferidos e o pacote da VM gerado e posto para rodar como na VM.
    name: Implantação (scripts, Caddyfile, serviço e pacote)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck dos scripts
        run: shellcheck deploy/scripts/*.sh

      - name: Caddyfile válido (imagem oficial do Caddy)
        run: |
          docker run --rm -e INDUSTRIALSIM_SITE=10.0.0.10 \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Unidade do systemd válida
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin industrialsim
          sudo install -d /opt/industrialsim/current /etc/industrialsim
          sudo install -m 0755 /bin/true /opt/industrialsim/current/IndustrialSim.Server
          sudo install -m 0640 deploy/config/industrialsim.env /etc/industrialsim/industrialsim.env
          systemd-analyze verify deploy/systemd/industrialsim.service

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pacote (publish.sh)
        run: sh deploy/scripts/publish.sh "ci-${GITHUB_SHA::7}"

      - name: O pacote roda como na VM (self-contained, configuração do industrialsim.env)
        run: |
          mkdir -p /tmp/pkg /tmp/state
          tar -C /tmp/pkg -xzf "artifacts/industrialsim-ci-${GITHUB_SHA::7}.tar.gz"
          app="/tmp/pkg/industrialsim-ci-${GITHUB_SHA::7}/app"
          test "$(cat "$app/VERSION")" = "ci-${GITHUB_SHA::7}"
          chmod +x "$app/IndustrialSim.Server"
          set -a
          . deploy/config/industrialsim.env
          set +a
          export Simulation__Instances__RecordingDirectory=/tmp/state/recordings
          (cd "$app" && ./IndustrialSim.Server > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5080/api/health > health.json && break
            sleep 1
          done
          cat health.json
          curl -sf http://127.0.0.1:5080/ | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:5080/api/scenarios | grep -q '"id":"caldeira"'
          # Kestrel só no loopback (o site entra pelo Caddy).
          ss -ltn | grep ':5080 ' | tee listen.txt
          grep -q '127.0.0.1:5080' listen.txt
          # (um "! grep" não pararia o passo: o bash -e ignora comandos negados)
          if grep -qE '(0\.0\.0\.0|\*|\[::\]):5080' listen.txt; then
            echo "O Kestrel está aberto para a rede."
            exit 1
          fi
          pkill -TERM -f IndustrialSim.Server
          echo "Pacote no ar e encerrado."

      - name: Log do servidor do pacote
        if: always()
        run: cat /tmp/server.log || true

      - uses: actions/upload-artifact@v7
        with:
          name: industrialsim-linux-x64
          path: artifacts/*.tar.gz
          retention-days: 14
