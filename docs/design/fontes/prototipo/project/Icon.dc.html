<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: inline-block; flex: none; vertical-align: middle">
  <sc-for list="{{ rects }}" as="r" hint-placeholder-count="0"><rect x="{{ r.x }}" y="{{ r.y }}" width="{{ r.w }}" height="{{ r.h }}" rx="{{ r.rx }}"></rect></sc-for>
  <sc-for list="{{ circles }}" as="c" hint-placeholder-count="0"><circle cx="{{ c.cx }}" cy="{{ c.cy }}" r="{{ c.r }}"></circle></sc-for>
  <sc-for list="{{ paths }}" as="p" hint-placeholder-count="1"><path d="{{ p.d }}"></path></sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["house","plus","x","chevron-down","share","download","pause","play","rotate","copy","search","settings","activity","plug","table","list","gauge","sun","moon","globe","user","users","check","alert","info","more","external","arrow-left","log-in","zap","book","cube","clock","eye"],"default":"house"},"size":{"editor":"int","default":20},"$preview":{"width":40,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    const R = (x, y, w, h, rx) => ({ x, y, w, h, rx });
    const C = (cx, cy, r) => ({ cx, cy, r });
    const defs = {
      house: { p: ['M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'] },
      plus: { p: ['M12 5v14', 'M5 12h14'] },
      x: { p: ['M6 6l12 12', 'M18 6 6 18'] },
      'chevron-down': { p: ['m6 9 6 6 6-6'] },
      share: { c: [C(18, 5, 3), C(6, 12, 3), C(18, 19, 3)], p: ['M8.6 13.5l6.8 4', 'M15.4 6.5l-6.8 4'] },
      download: { p: ['M12 3v12', 'M7 10l5 5 5-5', 'M5 21h14'] },
      pause: { p: ['M9 5v14', 'M15 5v14'] },
      play: { p: ['M7 5l12 7-12 7z'] },
      rotate: { p: ['M3 12a9 9 0 1 0 3-6.7L3 8', 'M3 3v5h5'] },
      copy: { r: [R(8, 8, 12, 12, 2)], p: ['M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2'] },
      search: { c: [C(11, 11, 7)], p: ['m20 20-3.5-3.5'] },
      settings: { c: [C(12, 12, 3)], p: ['M12 2v3', 'M12 19v3', 'M2 12h3', 'M19 12h3', 'M4.9 4.9 7 7', 'M17 17l2.1 2.1', 'M4.9 19.1 7 17', 'M17 7l2.1-2.1'] },
      activity: { p: ['M3 12h4l3-8 4 16 3-8h4'] },
      plug: { p: ['M9 2v6', 'M15 2v6', 'M6 8h12v4a6 6 0 0 1-12 0z', 'M12 18v4'] },
      table: { r: [R(3, 3, 18, 18, 2)], p: ['M3 9h18', 'M3 15h18', 'M9 3v18'] },
      list: { p: ['M8 6h13', 'M8 12h13', 'M8 18h13', 'M3 6h.01', 'M3 12h.01', 'M3 18h.01'] },
      gauge: { p: ['M12 14l4-4', 'M3.5 18a9 9 0 1 1 17 0'] },
      sun: { c: [C(12, 12, 4)], p: ['M12 2v2', 'M12 20v2', 'M2 12h2', 'M20 12h2', 'M4.9 4.9l1.4 1.4', 'M17.7 17.7l1.4 1.4', 'M4.9 19.1l1.4-1.4', 'M17.7 6.3l1.4-1.4'] },
      moon: { p: ['M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'] },
      globe: { c: [C(12, 12, 9)], p: ['M3 12h18', 'M12 3a14 14 0 0 1 0 18', 'M12 3a14 14 0 0 0 0 18'] },
      user: { c: [C(12, 8, 4)], p: ['M4 21a8 8 0 0 1 16 0'] },
      users: { c: [C(9, 8, 4)], p: ['M2 21a7 7 0 0 1 14 0', 'M16 4a4 4 0 0 1 0 8', 'M22 21a7 7 0 0 0-4.5-6.5'] },
      check: { p: ['M5 12l5 5 9-10'] },
      alert: { p: ['M12 3 2 20h20z', 'M12 10v4', 'M12 17h.01'] },
      info: { c: [C(12, 12, 9)], p: ['M12 11v5', 'M12 8h.01'] },
      more: { p: ['M5 12h.01', 'M12 12h.01', 'M19 12h.01'] },
      external: { p: ['M14 4h6v6', 'M20 4 10 14', 'M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5'] },
      'arrow-left': { p: ['M19 12H5', 'M11 6l-6 6 6 6'] },
      'log-in': { p: ['M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4', 'M10 17l5-5-5-5', 'M15 12H3'] },
      zap: { p: ['M13 2 4 14h7l-1 8 9-12h-7z'] },
      book: { p: ['M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z', 'M20 19v2H6'] },
      cube: { p: ['M12 2 3 7v10l9 5 9-5V7z', 'M3 7l9 5 9-5', 'M12 12v10'] },
      clock: { c: [C(12, 12, 9)], p: ['M12 7v5l3 2'] },
      eye: { c: [C(12, 12, 3)], p: ['M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z'] }
    };
    const d = defs[this.props.icon] ?? defs.house;
    const size = Number(this.props.size ?? 20);
    return {
      size,
      stroke: this.props.icon === 'more' ? 3 : 2,
      paths: (d.p ?? []).map((x) => ({ d: x })),
      circles: d.c ?? [],
      rects: d.r ?? []
    };
  }
}
</script>
</body>
</html>
