<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barra global</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c8dfaff3c31198ac92f85c7937c771d0">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="app" style="font-family: var(--font-family-base); color: var(--color-text)">
<header class="gbar">
  <a class="brand" href="Main.dc.html" aria-label="IndustrialSim Web, página inicial">
    <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" style="stroke: var(--color-text)" stroke-width="5"></circle><path d="M6 32 H58" style="stroke: var(--color-text)" stroke-width="5"></path><path d="M13 26 H21 C25 26 25 13 31 13 C37 13 37 19 51 19" fill="none" style="stroke: var(--color-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span class="brand-name">IndustrialSim<span> Web</span></span>
  </a>
  <nav class="gnav" aria-label="Menu principal">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
      <a href="{{ i.href }}" class="{{ i.cls }}" aria-current="{{ i.current }}">{{ i.label }}</a>
    </sc-for>
  </nav>
  <div class="row push" style="gap: 8px">
    <button type="button" class="btn btn-ghost btn-sm" aria-label="Idioma: português"><dc-import name="Icon" icon="globe" size="{{ s18 }}" hint-size="18px,18px"></dc-import> PT</button>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" aria-label="Tema escuro"><dc-import name="Icon" icon="moon" size="{{ s18 }}" hint-size="18px,18px"></dc-import></button>
    <sc-if value="{{ isVisitor }}" hint-placeholder-val="{{ false }}">
      <a class="btn btn-sm" href="T13-Entrar.dc.html"><dc-import name="Icon" icon="log-in" size="{{ s18 }}" hint-size="18px,18px"></dc-import> Entrar</a>
    </sc-if>
    <sc-if value="{{ isUser }}" hint-placeholder-val="{{ true }}">
      <span style="position: relative; display: inline-flex">
      <button type="button" class="btn btn-ghost btn-sm" aria-label="Conta de {{ userName }}" aria-haspopup="menu" aria-expanded="{{ acctOpen }}" onClick="{{ toggleAcct }}"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: var(--color-surface-sunken); border: 1px solid var(--color-border); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">{{ initials }}</span>{{ userName }}<dc-import name="Icon" icon="chevron-down" size="{{ s16 }}" hint-size="16px,16px"></dc-import></button>
      <sc-if value="{{ acctOpen }}" hint-placeholder-val="{{ false }}">
        <nav class="pop menu" aria-label="Conta" style="right: 0; top: 44px; width: 280px">
          <div style="padding: 10px 14px 12px; border-bottom: 1px solid var(--color-border)"><strong>{{ userName }}</strong><br><span class="muted small">{{ email }}</span></div>
          <a href="T14-MinhasPlantas.dc.html">Minhas plantas</a>
          <a href="T16-Turmas.dc.html">Turmas</a>
          <a href="#conta">Conta e privacidade</a>
          <a href="#ajuda">Ajuda e guias</a>
          <a href="Main.dc.html" style="border-top: 1px solid var(--color-border)">Sair</a>
        </nav>
      </sc-if>
      </span>
    </sc-if>
  </div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","cenarios","plantas","turmas","ajuda"],"default":"inicio"},"user":{"editor":"enum","options":["visitante","aluno","professor"],"default":"visitante"},"startMenu":{"editor":"enum","options":["nao","sim"],"default":"nao"},"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { acct: null };
  }
  renderVals() {
    const acctOpen = this.state.acct ?? (this.props.startMenu === 'sim');
    const active = this.props.active ?? 'inicio';
    const user = this.props.user ?? 'visitante';
    const all = [
      { id: 'cenarios', label: 'Cenários', href: 'T03-Cenarios.dc.html', any: true },
      { id: 'plantas', label: 'Minhas plantas', href: 'T14-MinhasPlantas.dc.html', any: false },
      { id: 'turmas', label: 'Turmas', href: 'T16-Turmas.dc.html', any: false },
      { id: 'ajuda', label: 'Ajuda e guias', href: '#ajuda', any: true }
    ];
    const items = all.filter((i) => i.any || user !== 'visitante').map((i) => ({
      ...i,
      cls: i.id === active ? 'is-active' : '',
      current: i.id === active ? 'page' : 'false'
    }));
    const prof = user === 'professor';
    return {
      items,
      s16: 16,
      s18: 18,
      isVisitor: user === 'visitante',
      isUser: user !== 'visitante',
      userName: prof ? 'Prof. Helena Prado' : 'Ana Ribeiro',
      initials: prof ? 'HP' : 'AR',
      email: prof ? 'helena.prado@exemplo.edu.br' : 'ana.ribeiro@exemplo.edu.br',
      acctOpen,
      toggleAcct: () => this.setState({ acct: !acctOpen })
    };
  }
}
</script>
</body>
</html>
