<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Planta · Log de comunicação</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c8dfaff3c31198ac92f85c7937c771d0">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="app" style="min-height: 1000px">
  <dc-import name="PlantBar" tab="log" open="process,trends,connection,settings,log" role="visitante" hint-size="100%,104px"></dc-import>
  <main class="col" style="gap: 12px; padding: 16px">
    <div role="group" aria-label="Filtrar eventos" class="row" style="gap: 8px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <button type="button" class="{{ f.cls }}" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 36px; cursor: pointer">{{ f.label }}</button>
      </sc-for>
      <span class="muted small push">Últimos 500 eventos · os novos entram no topo</span>
    </div>
    <div class="panel" style="padding: 0; overflow-x: auto">
      <table class="table">
        <thead><tr><th style="width: 110px">Horário</th><th>Evento</th><th style="width: 220px">Autor</th></tr></thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
            <tr class="{{ r.cls }}"><td class="mono">{{ r.t }}</td><td><sc-if value="{{ r.exc }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; padding: 0 6px; margin-right: 8px; border: 2px solid var(--color-text); border-radius: 4px; font-size: 12px; font-weight: 700; letter-spacing: .04em">EXCEÇÃO</span></sc-if>{{ r.ev }}</td><td class="muted mono small">{{ r.who }}</td></tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const nav = '192.168.10.31 (navegador)';
    const all = [
      { k: 'config', t: '09:19:02', ev: 'Formato analógico: 0–27648 → 0–10000.', who: nav, recent: true },
      { k: 'exc', t: '09:18:40', ev: 'Exceção 11 (Unit ID não atendido) para 200.18.4.42 na função 3. ×37', who: '200.18.4.42' },
      { k: 'config', t: '09:18:35', ev: 'Unit ID: 255 → 1.', who: nav },
      { k: 'conn', t: '09:12:08', ev: 'Mestre 200.18.4.42 conectado (porta de origem 50109).', who: '200.18.4.42' },
      { k: 'pair', t: '09:12:08', ev: 'Pareamento de 200.18.4.42 aceito.', who: nav },
      { k: 'pair', t: '09:12:07', ev: 'Pedido de pareamento de 200.18.4.42.', who: '200.18.4.42' },
      { k: 'plant', t: '09:10:55', ev: 'Planta criada a partir do cenário Caldeira com tubulão.', who: nav }
    ];
    const fdefs = [['all', 'Todos'], ['conn', 'Conexões'], ['pair', 'Pareamento'], ['exc', 'Exceções Modbus · 1'], ['config', 'Configuração'], ['plant', 'Planta']];
    const f = this.state.filter;
    return {
      filters: fdefs.map(([id, label]) => ({
        label, on: f === id ? 'true' : 'false',
        cls: f === id ? 'chip is-on' : 'chip',
        pick: () => this.setState({ filter: id })
      })),
      rows: all.filter((r) => f === 'all' || r.k === f).map((r) => ({
        ...r, exc: r.k === 'exc',
        cls: r.recent ? 'is-recent' : ''
      }))
    };
  }
}
</script>
</body>
</html>
