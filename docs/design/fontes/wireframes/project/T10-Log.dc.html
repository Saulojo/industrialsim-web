<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>T10 Log de comunicação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#202124}a:hover{color:#000}
.wf{font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;color:#202124;background:#fff}
.box{border:1px solid #9aa0a6;border-radius:8px;background:#fff;padding:16px;box-sizing:border-box}
.muted{color:#5f6368}
.mono{font-family:ui-monospace,Consolas,monospace}
.fchip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid #9aa0a6;border-radius:18px;background:#fff;font:inherit}
.fon{border:2px solid #202124;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #dadce0;vertical-align:top}
th{font-size:12px;font-weight:600;color:#5f6368}
h1,h2,h3,p{margin:0}
</style>
</helmet>
<div class="wf" style="width: 100%; min-height: 1000px">
  <dc-import name="PlantBar" tab="log" open="process,settings,monitor,log" master="connected" status="running" role="membro" alarms="{{ zero }}" hint-size="100%,100px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 32px">
    <div role="group" aria-label="Filtrar eventos" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <button type="button" class="fchip fon" aria-pressed="true">Todos</button>
      <button type="button" class="fchip" aria-pressed="false">Conexões</button>
      <button type="button" class="fchip" aria-pressed="false">Pareamento</button>
      <button type="button" class="fchip" aria-pressed="false">▲ Exceções Modbus · 1</button>
      <button type="button" class="fchip" aria-pressed="false">Configuração</button>
      <button type="button" class="fchip" aria-pressed="false">Planta</button>
      <span class="muted" style="margin-left: auto">Últimos 500 eventos · os novos entram no topo</span>
    </div>
    <div class="box" style="padding: 0">
      <table>
        <thead><tr><th style="width: 110px">Horário</th><th>Evento</th><th style="width: 200px">Autor</th></tr></thead>
        <tbody>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
            <tr style="{{ r.style }}"><td class="mono">{{ r.t }}</td><td>{{ r.ev }}</td><td class="muted">{{ r.who }}</td></tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const exc = 'outline: 3px solid #202124; outline-offset: -3px; font-weight: 600;';
    const rows = [
      { t: '09:19:02', ev: 'Formato analógico: 0–27648 → 0–10000.', who: '192.168.10.31 (navegador)' },
      { t: '09:18:40', ev: '▲ Exceção 11 (Unit ID não atendido) para 200.18.4.42 na função 3. ×37', who: '200.18.4.42', style: exc },
      { t: '09:18:35', ev: 'Unit ID: 255 → 1.', who: '192.168.10.31 (navegador)' },
      { t: '09:12:08', ev: 'Mestre 200.18.4.42 conectado (porta de origem 50109).', who: '200.18.4.42' },
      { t: '09:12:08', ev: 'Pareamento de 200.18.4.42 aceito.', who: '192.168.10.31 (navegador)' },
      { t: '09:12:07', ev: 'Pedido de pareamento de 200.18.4.42.', who: '200.18.4.42' },
      { t: '09:10:55', ev: 'Planta reiniciada (reinício 1).', who: '192.168.10.31 (navegador)' }
    ].map((r) => ({ ...r, style: r.style || '' }));
    return { rows, zero: 0 };
  }
}
</script>
</body>
</html>
